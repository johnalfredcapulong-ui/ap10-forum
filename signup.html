<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — AP10 Localized Learning</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-sub">Sign up to join the discussion.</p>

    <form id="signup-form" class="auth-form">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Juan Dela Cruz" maxlength="50" />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters" minlength="6" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn">Sign Up</button>
      <p class="form-msg" id="msg"></p>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>

  <script type="module">
    import { signUp, redirectIfAuthed } from './js/auth.js';

    redirectIfAuthed();

    const form = document.getElementById('signup-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = 'Creating account...';
      msg.className = 'form-msg';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await signUp(email, password, name);

      if (error) {
        msg.textContent = error.message;
        msg.className = 'form-msg error';
        return;
      }

      // Auto-confirm is on, so user is logged in automatically
      if (data.session) {
        window.location.href = 'index.html';
      } else {
        // Fallback: if email confirm is somehow still required
        msg.textContent = 'Account created. You can now log in.';
        msg.className = 'form-msg success';
        setTimeout(() => window.location.href = 'login.html', 1500);
      }
    });
  </script>
</body>
</html>
