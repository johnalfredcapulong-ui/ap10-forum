<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — AP10 Localized Learning</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Log In</h1>
    <p class="auth-sub">Welcome back. Sign in to continue.</p>

    <form id="login-form" class="auth-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn">Log In</button>
      <p class="form-msg" id="msg"></p>
    </form>

    <p class="auth-footer">
      No account yet? <a href="signup.html">Sign up</a>
    </p>
  </div>

  <script type="module">
    import { signIn, redirectIfAuthed } from './js/auth.js';

    redirectIfAuthed();

    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = 'Logging in...';
      msg.className = 'form-msg';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await signIn(email, password);

      if (error) {
        msg.textContent = error.message;
        msg.className = 'form-msg error';
        return;
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
