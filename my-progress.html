<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Progress — DocuLearn</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar"></aside>

    <div class="dashboard-main">
      <div class="topbar"></div>

      <div class="dashboard-content">
        <h1 class="page-title">My Progress</h1>
        <p class="page-sub">Every local story is a step toward social understanding.</p>

        <div class="stats-row" id="summary-stats"></div>

        <h2 class="section-title" style="font-size:1.05rem; margin-top:2rem;">Modules</h2>
        <div id="progress-list">
          <p class="loading">Loading...</p>
        </div>

        <h2 class="section-title" style="font-size:1.05rem; margin-top:2.5rem;">Quiz Attempts</h2>
        <div id="quiz-attempts">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initLayout } from './js/layout.js';
    import { supabase } from './js/supabase.js';
    import { getModuleProgress } from './js/progress.js';

    const user = await initLayout('my-progress.html');
    if (!user) throw new Error('Not logged in');

    const statsEl = document.getElementById('summary-stats');
    const listEl = document.getElementById('progress-list');

    async function loadProgress() {
      const { data: modules, error } = await supabase
        .from('topics')
        .select('*')
        .order('order_index', { ascending: true });

      if (error) {
        listEl.innerHTML = `<p class="error">Error: ${error.message}</p>`;
        return;
      }

      const rows = await Promise.all(
        (modules || []).map(async (m) => {
          const p = await getModuleProgress(m.id);
          let status = 'Not started';
          let statusClass = '';
          if (p.percent >= 100) { status = 'Completed'; statusClass = 'completed'; }
          else if (p.percent > 0) { status = 'In progress'; statusClass = 'in-progress'; }

          return `
            <div class="progress-row">
              <div class="progress-row-header">
                <div>
                  <h3>${escapeHtml(m.title)}</h3>
                  <span class="progress-status ${statusClass}">${status}</span>
                </div>
              </div>
              <div class="module-progress">
                <div class="module-progress-bar">
                  <div class="module-progress-fill" style="width: ${p.percent}%"></div>
                </div>
                <div class="module-progress-label">
                  <span>${p.completed} of ${p.total} materials</span>
                  <span>${p.percent}%</span>
                </div>
              </div>
              <a href="topic.html?slug=${m.slug}" class="progress-continue">Continue learning →</a>
            </div>
          `;
        })
      );

      listEl.innerHTML = rows.join('');

      // Summary
      const totalCompleted = modules.reduce((sum, m) => sum, 0); // placeholder
      const totalMaterials = modules.reduce((sum, m) => sum, 0); // placeholder

      // Get real totals
      const [{ count: totalMats }, { count: completedMats }] = await Promise.all([
        supabase.from('materials').select('*', { count: 'exact', head: true }),
        supabase.from('completed_materials').select('*', { count: 'exact', head: true }).eq('user_id', user.id),
      ]);

      const { count: reflections } = await supabase
        .from('posts').select('*', { count: 'exact', head: true })
        .eq('user_id', user.id).eq('type', 'reflection');

      const { count: discussions } = await supabase
        .from('posts').select('*', { count: 'exact', head: true })
        .eq('user_id', user.id);

      const percent = totalMats ? Math.round((completedMats / totalMats) * 100) : 0;

      statsEl.innerHTML = `
        <div class="stat-card">
          <div class="stat-card-num">${percent}%</div>
          <div class="stat-card-label">Overall progress</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num">${completedMats || 0}</div>
          <div class="stat-card-label">Materials completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num">${reflections || 0}</div>
          <div class="stat-card-label">Reflections</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num">${discussions || 0}</div>
          <div class="stat-card-label">Total contributions</div>
        </div>
      `;
    }

    async function loadQuizAttempts() {
      const el = document.getElementById('quiz-attempts');

      const { data, error } = await supabase
        .from('assessment_attempts')
        .select('*, materials(title, topics(title, slug))')
        .eq('user_id', user.id)
        .eq('submitted', true)
        .order('submitted_at', { ascending: false })
        .limit(20);

      if (error) {
        el.innerHTML = `<p class="error">Error: ${error.message}</p>`;
        return;
      }

      if (!data?.length) {
        el.innerHTML = '<p class="empty">No quiz attempts yet. Take an assessment from the Assessment page.</p>';
        return;
      }

      el.innerHTML = data.map((a) => {
        const percent = a.total ? Math.round((a.score / a.total) * 100) : 0;
        const passed = percent >= (a.pass_percent || 70);
        return `
          <div class="progress-row">
            <div class="progress-row-header">
              <div>
                <h3>${escapeHtml(a.materials?.title || 'Assessment')}</h3>
                <p style="font-size:0.85rem; color:#6b7280; margin-top:0.25rem;">
                  ${escapeHtml(a.materials?.topics?.title || '')} · 
                  ${new Date(a.submitted_at).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' })}
                </p>
              </div>
              <div style="text-align:right;">
                <div style="font-size:1.5rem; font-weight:800; color:${passed ? '#1e4620' : '#dc2626'};">
                  ${percent}%
                </div>
                <span class="progress-status ${passed ? 'completed' : ''}" style="${passed ? '' : 'background:#fef2f2; color:#dc2626;'}">
                  ${passed ? 'Passed' : 'Failed'}
                </span>
              </div>
            </div>
            <div class="module-progress">
              <div class="module-progress-bar">
                <div class="module-progress-fill" style="width: ${percent}%; background: ${passed ? '#2d5016' : '#dc2626'};"></div>
              </div>
              <div class="module-progress-label">
                <span>${a.score} of ${a.total} correct</span>
                <span>${percent}%</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    loadProgress();
    loadQuizAttempts();
  </script>
</body>
</html>
