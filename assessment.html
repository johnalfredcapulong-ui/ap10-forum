<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment — DocuLearn</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar"></aside>

    <div class="dashboard-main">
      <div class="topbar"></div>

      <div class="dashboard-content">
        <h1 class="page-title">Assessment</h1>
        <p class="page-sub">Test your understanding of each module.</p>

        <div class="filter-row">
          <select id="filter-module">
            <option value="">All modules</option>
          </select>
        </div>

        <div id="quizzes">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initLayout } from './js/layout.js';
    import { supabase } from './js/supabase.js';

    const user = await initLayout('assessment.html');
    if (!user) throw new Error('Not logged in');

    const quizzesEl = document.getElementById('quizzes');
    const moduleFilter = document.getElementById('filter-module');

    let allQuizzes = [];

    async function loadQuizzes() {
      // Materials of kind = assessment
      const { data, error } = await supabase
        .from('materials')
        .select('*, topics(title, slug)')
        .eq('kind', 'assessment')
        .order('order_index', { ascending: true });

      if (error) {
        quizzesEl.innerHTML = `<p class="error">Error: ${error.message}</p>`;
        return;
      }

      allQuizzes = data || [];

      // Get attempt info for each quiz
      const quizIds = allQuizzes.map((q) => q.id);
      let attempts = [];

      if (quizIds.length) {
        const { data: attemptsData } = await supabase
          .from('assessment_attempts')
          .select('*')
          .eq('user_id', user.id)
          .in('material_id', quizIds);

        attempts = attemptsData || [];
      }

      // Populate module filter
      const modules = [...new Map(allQuizzes.map((q) => [q.topic_id, q.topics])).values()].filter(Boolean);
      moduleFilter.innerHTML = '<option value="">All modules</option>' +
        modules.map((m) => `<option value="${m.slug}">${m.title}</option>`).join('');

      renderQuizzes(allQuizzes, attempts);
    }

    function renderQuizzes(quizzes, attempts) {
      if (!quizzes.length) {
        quizzesEl.innerHTML = '<p class="empty">No assessments yet. Check back soon!</p>';
        return;
      }

      quizzesEl.innerHTML = `
        <div class="quizzes-list">
          ${quizzes.map((q) => {
            const attempt = attempts.find((a) => a.material_id === q.id && a.submitted);
            const status = attempt
              ? `${attempt.score} / ${attempt.total} (${Math.round((attempt.score / attempt.total) * 100)}%)`
              : 'Not yet taken';
            const statusClass = attempt ? 'active' : 'soon';
            return `
              <div class="quiz-item">
                <div>
                  <strong>${escapeHtml(q.title || 'Assessment')}</strong>
                  <p>${escapeHtml(q.topics?.title || '')} · ${q.pass_percent || 70}% to pass</p>
                </div>
                <div style="display:flex;align-items:center;gap:0.75rem;">
                  <span class="activity-status ${statusClass}">${status}</span>
                  <button class="btn" data-quiz-id="${q.id}" data-quiz-title="${escapeHtml(q.title || 'Assessment')}">
                    ${attempt ? 'Retake' : 'Start Quiz'}
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      quizzesEl.querySelectorAll('[data-quiz-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          startQuiz(btn.dataset.quizId, btn.dataset.quizTitle);
        });
      });
    }

    // ---------- Quiz taking flow ----------
    async function startQuiz(quizId, quizTitle) {
      const { data: questions, error } = await supabase
        .from('questions')
        .select('*')
        .eq('material_id', quizId)
        .order('order_index', { ascending: true });

      if (error || !questions?.length) {
        alert('This quiz has no questions yet.');
        return;
      }

      renderQuizModal(quizId, quizTitle, questions);
    }

    function renderQuizModal(quizId, quizTitle, questions) {
      const modal = document.createElement('div');
      modal.className = 'quiz-modal';

      modal.innerHTML = `
        <div class="quiz-modal-backdrop"></div>
        <div class="quiz-modal-card">
          <button class="quiz-modal-close" aria-label="Close">×</button>

          <div class="quiz-header">
            <span class="video-tag">Assessment</span>
            <h2>${escapeHtml(quizTitle)}</h2>
            <p class="quiz-progress" id="quiz-progress">Question 1 of ${questions.length}</p>
          </div>

          <div class="quiz-body" id="quiz-body">
            ${questions.map((q, i) => `
              <div class="quiz-question" data-index="${i}" style="display:${i === 0 ? 'block' : 'none'};">
                <h3>${escapeHtml(q.prompt)}</h3>
                <div class="quiz-choices">
                  ${(q.choices || []).map((choice, ci) => `
                    <label class="quiz-choice">
                      <input type="radio" name="q-${i}" value="${escapeHtml(choice)}" data-index="${i}" />
                      <span>${escapeHtml(choice)}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="quiz-footer">
            <button class="btn-secondary" id="quiz-prev" style="display:none;">← Previous</button>
            <button class="btn" id="quiz-next">Next →</button>
            <button class="btn" id="quiz-submit" style="display:none;">Submit Quiz</button>
          </div>

          <div class="quiz-results" id="quiz-results" style="display:none;"></div>
        </div>
      `;

      document.body.appendChild(modal);
      document.body.style.overflow = 'hidden';

      let currentIndex = 0;
      const answers = {}; // { questionIndex: chosenValue }

      const prevBtn = modal.querySelector('#quiz-prev');
      const nextBtn = modal.querySelector('#quiz-next');
      const submitBtn = modal.querySelector('#quiz-submit');
      const progressEl = modal.querySelector('#quiz-progress');
      const questionsEl = modal.querySelectorAll('.quiz-question');

      function updateNav() {
        questionsEl.forEach((el, i) => {
          el.style.display = i === currentIndex ? 'block' : 'none';
        });

        progressEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;

        prevBtn.style.display = currentIndex > 0 ? 'inline-flex' : 'none';
        nextBtn.style.display = currentIndex < questions.length - 1 ? 'inline-flex' : 'none';
        submitBtn.style.display = currentIndex === questions.length - 1 ? 'inline-flex' : 'none';
      }

      modal.querySelectorAll('input[type="radio"]').forEach((input) => {
        input.addEventListener('change', (e) => {
          answers[parseInt(e.target.dataset.index)] = e.target.value;
        });
      });

      prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateNav();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          updateNav();
        }
      });

      submitBtn.addEventListener('click', async () => {
        // Check all answered
        const unanswered = questions.filter((_, i) => !answers[i]).length;
        if (unanswered > 0) {
          if (!confirm(`${unanswered} question(s) unanswered. Submit anyway?`)) return;
        }

        await submitQuiz(modal, quizId, questions, answers, user);
      });

      const close = () => {
        modal.remove();
        document.body.style.overflow = '';
      };

      modal.querySelector('.quiz-modal-close').addEventListener('click', close);
      modal.querySelector('.quiz-modal-backdrop').addEventListener('click', close);
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') {
          close();
          document.removeEventListener('keydown', esc);
        }
      });

      updateNav();
    }

    async function submitQuiz(modal, quizId, questions, answers, user) {
      // Auto-grade
      let score = 0;
      const answersPayload = questions.map((q, i) => {
        const given = answers[i] || '';
        const correct = (q.correct_answer || '').trim().toLowerCase();
        const isCorrect = given.trim().toLowerCase() === correct;
        if (isCorrect) score++;
        return {
          question_id: q.id,
          response: given,
          earned: isCorrect ? 1 : 0,
        };
      });

      const total = questions.length;
      const passPercent = 70;
      const percent = total ? Math.round((score / total) * 100) : 0;
      const passed = percent >= passPercent;

      // Create attempt
      const { data: attempt, error: attemptErr } = await supabase
        .from('assessment_attempts')
        .insert({
          user_id: user.id,
          material_id: quizId,
          score,
          total,
          pass_percent: passPercent,
          passed,
          submitted: true,
          submitted_at: new Date().toISOString(),
        })
        .select()
        .single();

      if (attemptErr || !attempt) {
        alert('Could not save your attempt: ' + (attemptErr?.message || 'unknown error'));
        return;
      }

      // Save answers
      const answerRows = answersPayload.map((a) => ({
        attempt_id: attempt.id,
        question_id: a.question_id,
        user_id: user.id,
        response: a.response,
        earned: a.earned,
      }));

      await supabase.from('student_answers').insert(answerRows);

      // Show results
      const resultsEl = modal.querySelector('#quiz-results');
      const footerEl = modal.querySelector('.quiz-footer');
      const bodyEl = modal.querySelector('#quiz-body');

      bodyEl.style.display = 'none';
      footerEl.style.display = 'none';

      resultsEl.style.display = 'block';
      resultsEl.innerHTML = `
        <div class="quiz-score-card">
          <div class="quiz-score-num" style="color: ${passed ? '#1e4620' : '#dc2626'};">${percent}%</div>
          <div class="quiz-score-label">${score} out of ${total} correct</div>
          <div class="quiz-score-status" style="background:${passed ? '#e8f0e3' : '#fef2f2'};color:${passed ? '#1e4620' : '#dc2626'};">
            ${passed ? 'Passed' : 'Not passed'}
          </div>
        </div>
        <button class="btn" id="quiz-done-btn" style="margin-top:1.5rem;">Done</button>
      `;

      resultsEl.querySelector('#quiz-done-btn').addEventListener('click', () => {
        modal.remove();
        document.body.style.overflow = '';
        loadQuizzes();
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    moduleFilter.addEventListener('change', () => {
      const slug = moduleFilter.value;
      const filtered = !slug
        ? allQuizzes
        : allQuizzes.filter((q) => q.topics?.slug === slug);
      loadQuizzesFiltered(filtered);
    });

    function loadQuizzesFiltered(quizzes) {
      // Re-render with the same attempt data
      const quizIds = quizzes.map((q) => q.id);
      supabase
        .from('assessment_attempts')
        .select('*')
        .eq('user_id', user.id)
        .in('material_id', quizIds)
        .then(({ data }) => renderQuizzes(quizzes, data || []));
    }

    loadQuizzes();
  </script>
</body>
</html>
