<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AP10 Localized Learning</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="user-nav" id="user-nav">
    <span class="user-name" id="nav-name">Loading...</span>
    <button class="logout-btn" id="logout-btn">Log Out</button>
  </nav>
  <header>
    <div class="header-top">
      <h1>AP10 Localized Learning</h1>
      <a href="admin.html" class="admin-link">Admin</a>
    </div>
    <p>Contemporary issues — local context of Guimba</p>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search topics..." />
    </div>

    <section id="topics" class="topics-grid">
      <p class="loading">Loading...</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { requireAuth, signOut } from './js/auth.js';

    const user = await requireAuth();
    if (user) {
      document.getElementById('nav-name').textContent = `Hi, ${user.user_metadata.name || 'Student'}`;
    }

    document.getElementById('logout-btn').addEventListener('click', signOut);
  </script> 
</body>
</html>
