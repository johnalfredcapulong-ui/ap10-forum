<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion — DocuLearn</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar"></aside>
    <div class="dashboard-main">
      <div class="topbar"></div>
      <div class="dashboard-content">
        <h1 class="page-title">Discussion</h1>
        <p class="page-sub">Share insights, ask questions, and reflect with classmates.</p>

        <div class="filter-row">
          <select id="filter-module">
            <option value="">All modules</option>
          </select>
        </div>

        <div id="discussions">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initLayout } from './js/layout.js';
    import { supabase } from './js/supabase.js';

    const user = await initLayout('discussion.html');
    if (!user) throw new Error('Not logged in');

    const el = document.getElementById('discussions');
    const moduleFilter = document.getElementById('filter-module');

    let allPosts = [];

    async function loadDiscussions() {
      const { data, error } = await supabase
        .from('posts')
        .select('*, topics(title, slug)')
        .is('parent_id', null)
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) {
        el.innerHTML = `<p class="error">Error: ${error.message}</p>`;
        return;
      }

      allPosts = data || [];

      const modules = [...new Map(allPosts.map((p) => [p.topic_id, p.topics])).values()].filter(Boolean);
      moduleFilter.innerHTML = '<option value="">All modules</option>' +
        modules.map((m) => `<option value="${m.slug}">${m.title}</option>`).join('');

      renderDiscussions(allPosts);
    }

    function renderDiscussions(posts) {
        if (!posts.length) {
          el.innerHTML = '<p class="empty">No discussions yet. Start one from any module.</p>';
          return;
        }

        el.innerHTML = posts.map((p) => {
          const kind = (p.kind || 'question').toLowerCase();
          const kindLabel = {
            question: 'Question',
            insight: 'Insight',
            opinion: 'Opinion',
            reflection: 'Reflection',
            discussion: 'Discussion',
          }[kind] || 'Discussion';

          return `
            <a class="post" href="topic.html?slug=${p.topics?.slug || ''}" style="display:block; text-decoration:none; color:inherit; margin-bottom:0.85rem;">
              <div class="post-header">
                <span class="badge">${kindLabel}</span>
                <strong>${escapeHtml(p.name || 'Anonymous')}</strong>
                <span class="date">${formatDate(p.created_at)}</span>
              </div>
              <h4>${escapeHtml(p.topics?.title || 'Untitled')}</h4>
              <p>${escapeHtml((p.content || '').slice(0, 200))}${(p.content || '').length > 200 ? '...' : ''}</p>
              <span class="progress-continue" style="margin-top:0.5rem; display:inline-block;">Open discussion (${p.reply_count || 0}) →</span>
            </a>
          `;
        }).join('');
      }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    moduleFilter.addEventListener('change', () => {
      const slug = moduleFilter.value;
      const filtered = !slug ? allPosts : allPosts.filter((p) => p.topics?.slug === slug);
      renderDiscussions(filtered);
    });

    loadDiscussions();
  </script>
</body>
</html>
