<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentaries — DocuLearn</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar"></aside>

    <div class="dashboard-main">
      <div class="topbar"></div>

      <div class="dashboard-content">
        <h1 class="page-title">Documentaries</h1>
        <p class="page-sub">Explore contextualized learning, one local story at a time.</p>

        <div class="filter-row">
          <input type="text" id="search" placeholder="Search titles, topics, or keywords..." />
          <select id="filter-module">
            <option value="">All modules</option>
          </select>
        </div>

        <div id="documentaries">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initLayout } from './js/layout.js';
    import { supabase } from './js/supabase.js';

    await initLayout('documentaries.html');

    const docsEl = document.getElementById('documentaries');
    const searchEl = document.getElementById('search');
    const moduleFilter = document.getElementById('filter-module');

    let allDocs = [];

    async function loadDocs() {
      // Load documentary materials
      const { data: mats, error: matsErr } = await supabase
        .from('materials')
        .select('*, topics(title, slug)')
        .eq('kind', 'documentary')
        .order('created_at', { ascending: false });

      // Load YouTube cached videos too — flatten
      const { data: cached } = await supabase
        .from('yt_cache')
        .select('query, results');

      allDocs = [];

      // Materials
      (mats || []).forEach((m) => {
        allDocs.push({
          source: 'material',
          id: m.id,
          title: m.title || m.caption || 'Documentary',
          topicTitle: m.topics?.title || '',
          topicSlug: m.topics?.slug || '',
          youtubeId: m.youtube_id,
          cover: m.url || (m.youtube_id ? `https://img.youtube.com/vi/${m.youtube_id}/maxresdefault.jpg` : ''),
          duration: m.duration_minutes,
        });
      });

      // YouTube cached
      (cached || []).forEach((row) => {
        (row.results || []).forEach((v) => {
          allDocs.push({
            source: 'cache',
            id: v.videoId,
            title: v.title,
            topicTitle: row.query,
            topicSlug: '',
            youtubeId: v.videoId,
            cover: v.thumbnail,
            channel: v.channel,
            duration: null,
          });
        });
      });

      // Populate module filter
      const modules = [...new Set(allDocs.map((d) => d.topicTitle).filter(Boolean))];
      moduleFilter.innerHTML = '<option value="">All modules</option>' +
        modules.map((m) => `<option value="${m}">${m}</option>`).join('');

      renderDocs(allDocs);
    }

    function renderDocs(docs) {
      if (!docs.length) {
        docsEl.innerHTML = '<p class="empty">No documentaries yet.</p>';
        return;
      }

      docsEl.innerHTML = `
        <div class="videos-grid">
          ${docs.map((d) => `
            <div class="video-card" data-video-id="${d.youtubeId || ''}" data-title="${escapeHtml(d.title)}">
              <div class="video-thumb">
                ${d.cover ? `<img src="${d.cover}" alt="${escapeHtml(d.title)}" loading="lazy" />` : ''}
                ${d.youtubeId ? `<div class="play-button">▶</div>` : ''}
              </div>
              <div class="video-meta">
                <span class="video-tag">Documentary</span>
                <h3>${escapeHtml(d.title)}</h3>
                <p>${escapeHtml(d.topicTitle || d.channel || '')}${d.duration ? ` · ${d.duration} min` : ''}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      docsEl.querySelectorAll('.video-card').forEach((card) => {
        if (!card.dataset.videoId) return;
        card.addEventListener('click', () => {
          openVideoModal(card.dataset.videoId, card.dataset.title);
        });
      });
    }

    function openVideoModal(videoId, title) {
      const modal = document.createElement('div');
      modal.className = 'video-modal';
      modal.innerHTML = `
        <div class="video-modal-backdrop"></div>
        <div class="video-modal-content">
          <button class="video-modal-close" aria-label="Close">×</button>
          <div class="video-modal-player">
            <iframe
              src="https://www.youtube.com/embed/${videoId}?autoplay=1"
              title="${escapeHtml(title)}"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.body.style.overflow = 'hidden';

      const close = () => {
        modal.remove();
        document.body.style.overflow = '';
      };
      modal.querySelector('.video-modal-close').addEventListener('click', close);
      modal.querySelector('.video-modal-backdrop').addEventListener('click', close);
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') {
          close();
          document.removeEventListener('keydown', esc);
        }
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    searchEl.addEventListener('input', () => {
      const q = searchEl.value.toLowerCase().trim();
      const mod = moduleFilter.value;
      const filtered = allDocs.filter((d) => {
        const matchesQ = !q ||
          d.title.toLowerCase().includes(q) ||
          (d.topicTitle || '').toLowerCase().includes(q);
        const matchesMod = !mod || d.topicTitle === mod;
        return matchesQ && matchesMod;
      });
      renderDocs(filtered);
    });

    moduleFilter.addEventListener('change', () => searchEl.dispatchEvent(new Event('input')));

    loadDocs();
  </script>
</body>
</html>
