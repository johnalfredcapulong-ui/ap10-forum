<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One-Minute Video — DocuLearn</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar"></aside>

    <div class="dashboard-main">
      <div class="topbar"></div>

      <div class="dashboard-content">
        <h1 class="page-title">One-Minute Video</h1>
        <p class="page-sub">Record a one-minute video answering a current issue. Upload it and share your thoughts — classmates and teachers can comment.</p>

        <div class="post-form-card">
          <h3>Submit a Video</h3>
          <form id="video-form">
            <div class="field">
              <label>Module</label>
              <select id="video-topic" required>
                <option value="">— Select a module —</option>
              </select>
            </div>

            <div class="field">
              <label>Video Title</label>
              <input type="text" id="video-title" required placeholder="Example: Polusyon sa Guimba" maxlength="120" />
            </div>

            <div class="field">
              <label>Upload Video</label>
              <div class="upload-zone" id="video-upload-zone">
                <input type="file" id="video-input" accept="video/*" hidden />
                <div class="upload-inner" id="video-upload-inner">
                  <div class="upload-icon">▶</div>
                  <p class="upload-text">Click to choose a video</p>
                  <p class="upload-hint">MP4, WebM, or MOV — max 50 MB</p>
                </div>
                <video id="video-preview" class="upload-preview" style="display:none;" controls></video>
              </div>
              <input type="hidden" id="video-url-hidden" />
              <small id="video-upload-status" class="upload-status"></small>
            </div>

            <div class="field">
              <label>Your thoughts (optional)</label>
              <textarea id="video-description" rows="3" placeholder="Bakit ito ang napili mong isyu? Ano ang iyong pananaw?" maxlength="500"></textarea>
            </div>

            <button type="submit" class="btn">Submit Video</button>
            <p class="form-msg" id="video-msg"></p>
          </form>
        </div>

        <h2 class="section-title" style="font-size:1.1rem; margin-top:2.5rem;">Submitted Videos</h2>
        <div id="video-list">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <style>
    #video-upload-zone {
      min-height: 200px;
    }
    #video-upload-zone video.upload-preview {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      background: #000;
      display: block;
      border-radius: 8px;
    }
    .video-submission {
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--ink-100);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .video-submission-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }
    .video-submission-header strong {
      color: var(--ink-900);
      font-size: 0.95rem;
    }
    .submitted-video {
      width: 100%;
      max-height: 400px;
      border-radius: 8px;
      background: #000;
      display: block;
      margin-top: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .video-submission h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink-900);
      margin-bottom: 0.25rem;
    }
  </style>

  <script type="module">
    import { initLayout } from './js/layout.js';
    import { supabase } from './js/supabase.js';

    const user = await initLayout('activities.html');
    if (!user) throw new Error('Not logged in');

    const userName = user.user_metadata.name || 'Student';

    const videoZone = document.getElementById('video-upload-zone');
    const videoInput = document.getElementById('video-input');
    const videoPreview = document.getElementById('video-preview');
    const videoUrlHidden = document.getElementById('video-url-hidden');
    const videoUploadStatus = document.getElementById('video-upload-status');
    const videoUploadInner = document.getElementById('video-upload-inner');

    // ---------- Load modules ----------
    async function loadTopics() {
      const { data } = await supabase
        .from('topics')
        .select('id, title')
        .order('order_index', { ascending: true })
        .order('title', { ascending: true });

      const select = document.getElementById('video-topic');
      select.innerHTML = '<option value="">— Select a module —</option>' +
        (data || []).map((t) => `<option value="${t.id}">${t.title}</option>`).join('');
    }

    // ---------- Video upload ----------
    videoZone.addEventListener('click', () => videoInput.click());

    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleVideoUpload(file);
    });

    async function handleVideoUpload(file) {
      if (!file.type.startsWith('video/')) {
        setVideoStatus('Not a valid video file.', 'error');
        return;
      }
      if (file.size > 50 * 1024 * 1024) {
        setVideoStatus('File exceeds 50 MB.', 'error');
        return;
      }

      setVideoStatus('Uploading video...', 'uploading');

      const ext = file.name.split('.').pop();
      const filename = `videos/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { data, error } = await supabase.storage
        .from('materials')
        .upload(filename, file, { cacheControl: '3600', upsert: false });

      if (error) {
        setVideoStatus(`Upload error: ${error.message}`, 'error');
        return;
      }

      const { data: publicData } = supabase.storage
        .from('materials')
        .getPublicUrl(data.path);

      videoUrlHidden.value = publicData.publicUrl;
      videoPreview.src = publicData.publicUrl;
      videoPreview.style.display = 'block';
      videoZone.classList.add('has-image');
      videoUploadInner.style.display = 'none';

      setVideoStatus('Uploaded. Ready to submit.', 'success');
    }

    function setVideoStatus(msg, type = '') {
      videoUploadStatus.textContent = msg;
      videoUploadStatus.className = 'upload-status ' + type;
    }

    function resetVideoUpload() {
      videoUrlHidden.value = '';
      videoPreview.src = '';
      videoPreview.style.display = 'none';
      videoZone.classList.remove('has-image');
      videoUploadInner.style.display = 'flex';
      videoInput.value = '';
      setVideoStatus('');
    }

    // ---------- Submit video ----------
    document.getElementById('video-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('video-msg');
      msg.textContent = 'Submitting...';
      msg.className = 'form-msg';

      const topicId = document.getElementById('video-topic').value;
      const title = document.getElementById('video-title').value.trim();
      const description = document.getElementById('video-description').value.trim();

      if (!topicId || !title || !videoUrlHidden.value) {
        msg.textContent = 'Please select a module, add a title, and upload a video.';
        msg.className = 'form-msg error';
        return;
      }

      const { error } = await supabase.from('posts').insert({
        topic_id: topicId,
        user_id: user.id,
        name: userName,
        title,
        content: description || title,
        kind: 'video',
        type: 'discussion',
        activity_type: 'video',
        video_url: videoUrlHidden.value,
        parent_id: null,
      });

      if (error) {
        msg.textContent = `Error: ${error.message}`;
        msg.className = 'form-msg error';
        return;
      }

      msg.textContent = 'Video submitted!';
      msg.className = 'form-msg success';
      document.getElementById('video-form').reset();
      resetVideoUpload();
      loadVideos();
    });

    // ---------- Load submitted videos ----------
    async function loadVideos() {
      const el = document.getElementById('video-list');
      const { data, error } = await supabase
        .from('posts')
        .select('*, topics(title, slug)')
        .eq('activity_type', 'video')
        .order('created_at', { ascending: false })
        .limit(30);

      if (error) {
        el.innerHTML = `<p class="error">Error: ${error.message}</p>`;
        return;
      }

      if (!data?.length) {
        el.innerHTML = '<p class="empty">No videos submitted yet. Be the first!</p>';
        return;
      }

      // Get comment counts
      const postIds = data.map((v) => v.id);
      let commentCounts = {};

      if (postIds.length) {
        const { data: comments } = await supabase
          .from('posts')
          .select('parent_id')
          .in('parent_id', postIds);

        (comments || []).forEach((c) => {
          commentCounts[c.parent_id] = (commentCounts[c.parent_id] || 0) + 1;
        });
      }

      el.innerHTML = data.map((v) => `
        <div class="video-submission">
          <div class="video-submission-header">
            <strong>${escapeHtml(v.name)}</strong>
            <span class="badge">Video</span>
            ${v.topics ? `<span style="color:#6b7280; font-size:0.85rem;">· ${escapeHtml(v.topics.title)}</span>` : ''}
            <span style="color:#9ca3af; font-size:0.82rem; margin-left:auto;">${formatDate(v.created_at)}</span>
          </div>
          ${v.title ? `<h4>${escapeHtml(v.title)}</h4>` : ''}
          ${v.video_url ? `<video src="${v.video_url}" controls preload="metadata" class="submitted-video"></video>` : ''}
          ${v.content && v.content !== v.title ? `<p style="color:#374151; font-size:0.92rem; margin-bottom:0.75rem;">${escapeHtml(v.content)}</p>` : ''}
          <button class="reply-toggle" data-parent="${v.id}">
            ${commentCounts[v.id] || 0} comment${(commentCounts[v.id] || 0) === 1 ? '' : 's'} — Show
          </button>
          <div class="replies" data-comments-for="${v.id}" style="display:none; margin-top:0.75rem;"></div>
          <div class="reply-form-wrap" data-form-for="${v.id}" style="display:none;">
            <textarea class="reply-content" placeholder="Write a comment..." maxlength="500"></textarea>
            <div class="reply-actions">
              <button class="btn-secondary reply-cancel">Cancel</button>
              <button class="btn reply-submit" data-parent="${v.id}">Comment</button>
            </div>
          </div>
        </div>
      `).join('');

      attachVideoHandlers();
    }

    function attachVideoHandlers() {
      document.querySelectorAll('.reply-toggle').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const parentId = btn.dataset.parent;
          const commentsEl = document.querySelector(`[data-comments-for="${parentId}"]`);
          const formEl = document.querySelector(`[data-form-for="${parentId}"]`);

          if (commentsEl.style.display === 'none') {
            await loadComments(parentId, commentsEl);
            commentsEl.style.display = 'block';
            formEl.style.display = 'block';
          } else {
            commentsEl.style.display = 'none';
            formEl.style.display = 'none';
          }
        });
      });

      document.querySelectorAll('.reply-cancel').forEach((btn) => {
        btn.addEventListener('click', () => {
          const wrap = btn.closest('.reply-form-wrap');
          wrap.querySelector('.reply-content').value = '';
          wrap.style.display = 'none';
        });
      });

      document.querySelectorAll('.reply-submit').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const wrap = btn.closest('.reply-form-wrap');
          const content = wrap.querySelector('.reply-content').value.trim();
          if (!content) {
            alert('Comment is required.');
            return;
          }

          const parentId = btn.dataset.parent;

          const { data: parentPost } = await supabase
            .from('posts')
            .select('topic_id, user_id, name')
            .eq('id', parentId)
            .maybeSingle();

          btn.disabled = true;
          btn.textContent = 'Posting...';

          const { error } = await supabase.from('posts').insert({
            topic_id: parentPost?.topic_id || null,
            parent_id: parentId,
            user_id: user.id,
            name: userName,
            content,
            type: 'discussion',
          });

          if (error) {
            alert('Error: ' + error.message);
            btn.disabled = false;
            btn.textContent = 'Comment';
            return;
          }

          // Notify the video author
          if (parentPost?.user_id && parentPost.user_id !== user.id) {
            await supabase.from('notifications').insert({
              recipient_id: parentPost.user_id,
              message: `${userName} commented on your video.`,
              kind: 'reply',
              discussion_id: parentId,
            });
          }

          const commentsEl = document.querySelector(`[data-comments-for="${parentId}"]`);
          await loadComments(parentId, commentsEl);
          wrap.querySelector('.reply-content').value = '';
          btn.disabled = false;
          btn.textContent = 'Comment';
        });
      });
    }

    async function loadComments(parentId, el) {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .eq('parent_id', parentId)
        .order('created_at', { ascending: true });

      if (error || !data?.length) {
        el.innerHTML = '<p style="color:#9ca3af; font-size:0.85rem;">No comments yet.</p>';
        return;
      }

      el.innerHTML = data.map((c) => `
        <div class="reply">
          <div class="reply-header">
            <strong>${escapeHtml(c.name)}</strong>
            <span style="color:#9ca3af; font-size:0.78rem;">${formatDate(c.created_at)}</span>
          </div>
          <p>${escapeHtml(c.content)}</p>
        </div>
      `).join('');
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const diff = (new Date() - d) / 1000 / 60;
      if (diff < 1) return 'Just now';
      if (diff < 60) return `${Math.floor(diff)}m ago`;
      if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
      if (diff < 10080) return `${Math.floor(diff / 1440)}d ago`;
      return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    loadTopics();
    loadVideos();
  </script>
</body>
</html>
